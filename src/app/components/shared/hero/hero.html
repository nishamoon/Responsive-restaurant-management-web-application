<section class="hero" [style.backgroundImage]="'linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url(' + bgImage + ')'">
  <div class="container hero-content">
    <h1 class="brand-font animate-up">{{ title }}</h1>
    <p class="animate-up delay-1">{{ subtitle }}</p>
    <div class="hero-btns animate-up delay-2">
      <a routerLink="/menu" class="btn btn-primary">Explore Menu</a>
      <a routerLink="/reservation" class="btn btn-outline">Book a Table</a>
    </div>
  </div>
</section>
